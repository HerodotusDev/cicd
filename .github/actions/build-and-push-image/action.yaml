---
name: "Build and Push Docker Image"
description: "Checks out code, sets up Buildx, logs in to Docker, and builds & pushes a Docker image."
inputs:
  registry:
    description: "Image repository prefix incl. registry host (e.g. ghcr.io/herodotusdev). Image = <registry>/<app><image_suffix>:<version>."
    required: true
  registry_host:
    description: "Registry host for docker login (e.g. ghcr.io)."
    required: true
  app_name:
    description: "The application name to form the image name."
    required: true
  image_suffix:
    description: "Image name suffix for the target environment ('-prod' or '-stg'). Derived once in load-inputs; passed in by the caller."
    required: false
    default: ""
  version:
    description: "Version tag to use (e.g. from a previous job output)."
    required: true
  dockerfile:
    description: "Path to the Dockerfile."
    required: true
    default: "./docker/dockerfile"
  registry_username:
    description: "Registry login (github.actor for ghcr)."
    required: true
  registry_password:
    description: "Registry password (github.token for ghcr; needs packages:write)."
    required: true
  context:
    description: "Build context directory."
    required: false
    default: "."
  build_env_file:
    description: "Absolute path to a .env file to inject into the build context as .env.production (written before Docker build, after checkout)."
    required: false
    default: ""
  checkout_token:
    description: "Token for checkout (PAT for private submodules, defaults to GITHUB_TOKEN)."
    required: false
    default: ""
  submodules:
    description: "Submodule checkout mode: 'true' (direct only, default), 'recursive' (all nested), or 'false' (none)."
    required: false
    default: "true"
  cache_mode:
    description: "BuildKit GHA cache export mode: min (final image layers only) or max (all stages)."
    required: false
    default: "max"
  cache_scope:
    description: "Optional GHA cache scope key. When set, cache-from/to use this scope instead of the default buildkit bucket."
    required: false
    default: ""
  platforms:
    description: "Comma-separated buildx platforms (default: linux/amd64,linux/arm64 — the home cluster schedules onto both amd64 and arm64 nodes). BuildKit stores layer caches per platform under the same scope. To opt an app out of arm64, set platforms: linux/amd64 in its cicd-inputs entry."

runs:
  using: "composite"
  steps:
    - name: Set up QEMU (binfmt for arm64)
      if: contains(inputs.platforms, 'arm64')
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.checkout_token || github.token }}

    - name: Fetch submodules
      if: inputs.submodules != 'false'
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ inputs.checkout_token || github.token }}@github.com/".insteadOf "https://github.com/"
        git submodule update --init --depth=1 ${{ inputs.submodules == 'recursive' && '--recursive' || '' }}


    - name: Inject build-time .env
      if: inputs.build_env_file != ''
      shell: bash
      run: |
        if [ -f "${{ inputs.build_env_file }}" ]; then
          cp "${{ inputs.build_env_file }}" "${{ inputs.context || '.' }}/.env.production"
          echo "Injected .env.production ($(wc -l < "${{ inputs.context || '.' }}/.env.production") lines) into build context"
        else
          echo "::warning::build_env_file set but file not found at ${{ inputs.build_env_file }}"
        fi

    - name: Log in to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry_host }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Set image
      shell: bash
      run: |
        echo "IMAGE=${{ inputs.registry }}/${{ inputs.app_name }}${{ inputs.image_suffix }}" >> $GITHUB_ENV


    - name: Check if Docker image exists
      id: check_image
      shell: bash
      
      run: |
        image="${{ env.IMAGE }}:${{ inputs.version }}"
        if docker manifest inspect "$image" >/dev/null 2>&1; then
          echo "Docker image '$image' exists."
          echo "image_exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "Docker image '$image' does not exist. Proceeding to build."
          echo "image_exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      if: ${{ steps.check_image.outputs.image_exists == 'false' }}
      with:
        install: true

    - name: Resolve consumer overrides
      id: overrides
      uses: HerodotusDev/cicd/.github/actions/resolve-overrides@main
      with:
        repository: ${{ github.repository }}
        app_name: ${{ inputs.app_name }}
        default_dockerfile: ${{ inputs.dockerfile }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      if: ${{ steps.check_image.outputs.image_exists == 'false' }}
      with:
        context: ${{ inputs.context }}
        file: ./docker/Dockerfile.${{ steps.overrides.outputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        cache-from: type=gha${{ inputs.cache_scope != '' && format(',scope={0}', inputs.cache_scope) || '' }}
        cache-to: type=gha,mode=${{ inputs.cache_mode }}${{ inputs.cache_scope != '' && format(',scope={0}', inputs.cache_scope) || '' }}
        network: host
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ inputs.version }}
        build-args: |
          APP_NAME=${{ steps.overrides.outputs.app_arg }}
