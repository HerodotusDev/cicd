---
name: "Deploy init pods + all apps (parallel)"
description: >
  Deploys every app of the run through ONE cluster tunnel from a single job:
  init pods first (run-to-completion), then all deploy apps concurrently —
  configmap, etcd secret, manifest apply and rollout wait per app. Bounded by
  the repo-level `deploy_concurrency` cicd-inputs key (default 5). The caller
  must have opened the cluster-access tunnel + etcd port-forward already; all
  workers share them.

inputs:
  namespace:
    description: "Kubernetes namespace to deploy to."
    required: true
  k8s_env:
    description: "Kubernetes environment (stg / prod) — locates manifests and etcd keys."
    required: true
  matrix_deploy:
    description: "JSON array of deploy apps (prep matrix_deploy output)."
    required: true
  matrix_init:
    description: "JSON array of init apps (prep matrix_init output)."
    required: false
    default: "[]"
  app_versions:
    description: "JSON map of app name to resolved version (prep app_versions output)."
    required: true
  primary_version:
    description: "Version used for init pods (prep primary_version output)."
    required: false
    default: ""
  registry:
    description: "Image repository prefix incl. registry host (e.g. ghcr.io/herodotusdev)."
    required: true
  image_suffix:
    description: "Image name suffix for the target environment ('-prod' or '-stg')."
    required: false
    default: ""
  rollout_timeout:
    description: "Rollout / completion timeout per app in seconds."
    required: false
    default: "500"
  etcd_root:
    description: "ETCD root path for config keys."
    required: true
  etcd_user:
    description: "ETCD username (exported by the cluster-access etcd forward)."
    required: false
    default: ""
  etcd_password:
    description: "ETCD password (exported by the cluster-access etcd forward)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Deploy init pods + all apps in parallel
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        K8S_ENV: ${{ inputs.k8s_env }}
        MATRIX_DEPLOY: ${{ inputs.matrix_deploy }}
        MATRIX_INIT: ${{ inputs.matrix_init }}
        APP_VERSIONS: ${{ inputs.app_versions }}
        PRIMARY_VERSION: ${{ inputs.primary_version }}
        REGISTRY: ${{ inputs.registry }}
        IMAGE_SUFFIX: ${{ inputs.image_suffix }}
        ROLLOUT_TIMEOUT: ${{ inputs.rollout_timeout }}
        ETCD_ROOT: ${{ inputs.etcd_root }}
        ETCD_USER: ${{ inputs.etcd_user }}
        ETCD_PASSWORD: ${{ inputs.etcd_password }}
      run: |
        bash "${GITHUB_ACTION_PATH}/deploy_all.sh"
