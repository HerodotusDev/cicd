# .github/actions/k8s-deploy/action.yml
name: "Deploy on K8s"
description: "Deploys Kubernetes resources using kubectl."
inputs:
  namespace:
    description: "Kubernetes namespace to deploy to."
    required: true
  deployment_file:
    description: "Path to the deployment YAML file."
    required: true
  ingress_file:
    description: "Path to the ingress YAML file."
    required: true
  rollout_timeout:
    description: "Rollout timeout for the deployment (e.g., 500s)."
    required: false
    default: "500"
  image_tag:
    description: "Image tag to deployed."
    required: true
    default: latest
  dockerhub_project:
    description: "The Docker Hub project (or organization/repository prefix) (e.g. myorg)"
    required: true
  app_name:
    description: "The application name to form the image name."
    required: true
  image_prefix:
    description: "Image name prefix for the target environment ('stg-' or ''). Derived once in load-inputs; passed in by the caller."
    required: false
    default: ""
  config_changed:
    description: "Whether config (secret/configmap) changed and deployment needs restart"
    required: false
    default: "false"
  edge_verify_secret:
    description: "Geoblock origin-lock secret. If set, replaces the __EDGE_VERIFY_SECRET__ placeholder in the ingress file before apply (no-op when the placeholder is absent). Sourced from the runner env (env.ARC_EDGE_VERIFY_SECRET); never committed to a repo."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: "v1.32.0"

    - name: Resolve consumer overrides
      id: overrides
      uses: HerodotusDev/cicd/.github/actions/resolve-overrides@main
      with:
        app_name: ${{ inputs.app_name }}

    - name: Update deployment YAML with image tag
      run: |
        sed -i "s|<IMAGE>|${{ inputs.dockerhub_project }}/${{ inputs.image_prefix }}${{ inputs.app_name }}:${{ inputs.image_tag }}|g" "${{ inputs.deployment_file }}"
      shell: bash

    - name: Inject geoblock origin-lock secret into ingress
      if: ${{ inputs.edge_verify_secret != '' }}
      shell: bash
      env:
        EDGE_VERIFY_SECRET: ${{ inputs.edge_verify_secret }}
      run: |
        echo "::add-mask::$EDGE_VERIFY_SECRET"
        if [ -f "${{ inputs.ingress_file }}" ]; then
          sed -i "s|__EDGE_VERIFY_SECRET__|${EDGE_VERIFY_SECRET}|g" "${{ inputs.ingress_file }}"
        fi
      
    - name: Deploy Deployment YAML (if exists)
      run: |
        if [ -f "${{ inputs.deployment_file }}" ]; then
          echo "Deployment file exists. Applying manifest..."
          kubectl apply --namespace "${{ inputs.namespace }}" -f "${{ inputs.deployment_file }}"
        else
          echo "No Deployment file found. Skipping deployment."
        fi
      shell: bash

    - name: Deploy Ingress YAML (if exists)
      run: |
        if [ -f "${{ inputs.ingress_file }}" ]; then
          echo "Ingress file exists. Applying manifest..."
          kubectl apply --namespace "${{ inputs.namespace }}" -f "${{ inputs.ingress_file }}"
        else
          echo "No Ingress file found. Skipping deployment."
        fi
      shell: bash

    - name: Wait for deployment apply to complete
      run: |
        kubectl rollout status deployment/"${{ inputs.app_name }}" --namespace "${{ inputs.namespace }}" --timeout=${{ inputs.rollout_timeout }}s
      shell: bash

    - name: Restart Deployment if Config Changed
      if: inputs.config_changed == 'true'
      shell: bash
      env:
        ALSO_RESTART: ${{ steps.overrides.outputs.also_restart }}
      run: |
        echo "Config changed - restarting deployment ${{ inputs.app_name }}..."
        kubectl rollout restart deployment/${{ inputs.app_name }} -n ${{ inputs.namespace }}
        IFS=',' read -ra EXTRA <<< "$ALSO_RESTART"
        for dep in "${EXTRA[@]}"; do
          [ -z "$dep" ] && continue
          echo "Also restarting $dep (configured for ${{ inputs.app_name }})..."
          kubectl rollout restart deployment/"$dep" -n ${{ inputs.namespace }}
        done

    - name: Wait for restart to complete
      if: inputs.config_changed == 'true'
      shell: bash
      env:
        ALSO_RESTART: ${{ steps.overrides.outputs.also_restart }}
      run: |
        kubectl rollout status deployment/"${{ inputs.app_name }}" --namespace "${{ inputs.namespace }}" --timeout=${{ inputs.rollout_timeout }}s
        IFS=',' read -ra EXTRA <<< "$ALSO_RESTART"
        for dep in "${EXTRA[@]}"; do
          [ -z "$dep" ] && continue
          kubectl rollout status deployment/"$dep" --namespace "${{ inputs.namespace }}" --timeout=${{ inputs.rollout_timeout }}s
        done
