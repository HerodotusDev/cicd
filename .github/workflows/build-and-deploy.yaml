name: Build & deploy

on:
  workflow_call:
    inputs:
      submodules:
        description: "Submodule checkout mode: 'true' (direct only, default), 'recursive' (all nested), or 'false' (none)."
        type: string
        required: false
        default: "true"
    secrets:
      SUBMODULES_PAT:
        description: "PAT for cloning private submodules. If omitted, submodules are still fetched with GITHUB_TOKEN (works for public submodules)."
        required: false

env:
  rollout_timeout: 500
  version_file: ./package.json
  version_key:
  inputs_files: ./k8s/cicd-inputs.yaml
  registry: ghcr.io/herodotusdev
  registry_host: ghcr.io

permissions:
  contents: write
  packages: write

jobs:
  prep:
    name: prep (guard + matrix)
    runs-on: ubuntu-latest
    outputs:
      matrix_apps: ${{ steps.build-matrix.outputs.matrix_apps }}
      matrix_deploy: ${{ steps.build-matrix.outputs.matrix_deploy }}
      matrix_init: ${{ steps.build-matrix.outputs.matrix_init }}
      app_versions: ${{ steps.build-matrix.outputs.app_versions }}
      primary_version: ${{ steps.build-matrix.outputs.primary_version }}
      unique_versions: ${{ steps.build-matrix.outputs.unique_versions }}
      build_env_payload: ${{ steps.pull-build-env.outputs.build_env_payload }}
    steps:
      - name: Guard branch
        uses: HerodotusDev/cicd/.github/actions/guard-branch@main

      - name: Checkout caller repo
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Build app matrix metadata
        id: build-matrix
        uses: HerodotusDev/cicd/.github/actions/build-matrix@main
        with:
          app_matrix: ${{ steps.load-inputs.outputs.app_matrix }}
          app_names: ${{ steps.load-inputs.outputs.app_names }}
          default_version_file: ${{ env.version_file }}
          default_version_key: ${{ env.version_key }}

      # Build-time env is pulled ONCE here, over this job's tunnel, and handed
      # to the build jobs as a base64 payload. The per-repo WG peer serves one
      # tunnel at a time, so the parallel arch build jobs must never open it
      # themselves.
      - name: Detect etcd build-env apps
        id: detect-etcd
        run: |
          needs_etcd=$(printf '%s' '${{ steps.build-matrix.outputs.matrix_deploy }}' | jq '[.[] | select((.etcd_build_env // false) == true)] | length > 0')
          echo "needs_etcd=${needs_etcd}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Cluster access (etcd over tunnel)
        if: steps.detect-etcd.outputs.needs_etcd == 'true'
        uses: HerodotusDev/cicd/.github/actions/cluster-access@main
        with:
          wg_config: ${{ secrets.WG_CONFIG }}
          deployer_kubeconfig: ${{ secrets.DEPLOYER_KUBECONFIG }}
          namespace: ${{ env.namespace }}
          etcd_forward: true

      - name: Pull build-time .env from ETCD
        id: pull-build-env
        if: steps.detect-etcd.outputs.needs_etcd == 'true'
        env:
          MATRIX_DEPLOY: ${{ steps.build-matrix.outputs.matrix_deploy }}
        run: |
          set -euo pipefail
          payload='{}'
          while IFS= read -r app; do
            [[ -z "${app}" ]] && continue
            name=$(jq -r '.name' <<<"${app}")
            etcd_name=$(jq -r '.etcd_name // .name' <<<"${app}")
            out="${RUNNER_TEMP}/${name}.env"
            rm -f "${out}"
            ETCD_HOST="http://127.0.0.1:2379" \
            ETCD_USER="${{ env.ETCD_USER }}" \
            ETCD_PASSWORD="${{ env.ETCD_PASSWORD }}" \
            ETCD_KEY="/${{ env.etcd_root || env.repo_name }}/${{ env.k8s_env }}/${etcd_name}/.env" \
            APP_NAME="${etcd_name}" \
            NAMESPACE="${{ env.namespace }}" \
            OUTPUT_FILE="${RUNNER_TEMP}/${name}.secret.yaml" \
            bash "${{ github.action_path }}/../etcd-pull/pull.sh" || true
            if [[ -s "${RUNNER_TEMP}/${name}.secret.yaml" ]]; then
              in_data=false
              : > "${out}"
              while IFS= read -r line; do
                if [[ "${line}" == "data:" ]]; then in_data=true; continue; fi
                if ${in_data}; then
                  if [[ "${line}" =~ ^[[:space:]]+([^:]+):[[:space:]]+(.+)$ ]]; then
                    echo "${BASH_REMATCH[1]}=$(echo "${BASH_REMATCH[2]}" | base64 -d 2>/dev/null || echo "${BASH_REMATCH[2]}")" >> "${out}"
                  elif [[ ! "${line}" =~ ^[[:space:]] ]]; then
                    break
                  fi
                fi
              done < "${RUNNER_TEMP}/${name}.secret.yaml"
              rm -f "${RUNNER_TEMP}/${name}.secret.yaml"
            fi
            if [[ -s "${out}" ]]; then
              echo "${name}: pulled $(wc -l < "${out}") lines of build-time env"
            else
              echo "::warning::No .env at /${{ env.etcd_root || env.repo_name }}/${{ env.k8s_env }}/${etcd_name}/.env — ${name} builds without it"
            fi
            payload=$(jq -cn --arg n "${name}" --arg v "$(base64 -w0 "${out}" 2>/dev/null || echo '')" '${payload} + {($n): $v}')
            rm -f "${out}"
          done < <(jq -c '.[] | select((.etcd_build_env // false) == true)' <<<"${MATRIX_DEPLOY}")
          size=$(jq -r '[.[] | length] | add // 0' <<<"${payload}")
          if (( size > 400000 )); then
            echo "::error::Build-env payload too large for step outputs (${size} base64 chars) — reduce etcd build-env keys."
            exit 1
          fi
          echo "build_env_payload=$(jq -c . <<<"${payload}")" >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    name: build (${{ matrix.arch }})
    needs: [prep]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 355
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout caller repo
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Build and push all images (parallel, shared cache)
        uses: HerodotusDev/cicd/.github/actions/build-and-push-images@main
        with:
          registry: ${{ env.registry }}
          registry_host: ${{ env.registry_host }}
          image_suffix: ${{ env.image_suffix }}
          matrix_deploy: ${{ needs.prep.outputs.matrix_deploy }}
          matrix_init: ${{ needs.prep.outputs.matrix_init }}
          app_versions: ${{ needs.prep.outputs.app_versions }}
          primary_version: ${{ needs.prep.outputs.primary_version }}
          build_env_payload: ${{ needs.prep.outputs.build_env_payload }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ github.token }}
          k8s_env: ${{ env.k8s_env }}
          platforms: ${{ format('linux/{0}', matrix.arch) }}

  finalize:
    name: finalize (merge + tag + deploy)
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Merge per-arch images into manifest lists
        uses: HerodotusDev/cicd/.github/actions/merge-manifests@main
        with:
          registry: ${{ env.registry }}
          registry_host: ${{ env.registry_host }}
          image_suffix: ${{ env.image_suffix }}
          matrix_deploy: ${{ needs.prep.outputs.matrix_deploy }}
          matrix_init: ${{ needs.prep.outputs.matrix_init }}
          app_versions: ${{ needs.prep.outputs.app_versions }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ github.token }}

      - name: Create Git tag
        uses: HerodotusDev/cicd/.github/actions/create-git-tag@main
        with:
          tag: ${{ needs.prep.outputs.primary_version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Single tunnel for the whole deploy: one WG peer per repo, one etcd
      # port-forward — all app deploys below share them in parallel.
      - name: Cluster access
        uses: HerodotusDev/cicd/.github/actions/cluster-access@main
        with:
          wg_config: ${{ secrets.WG_CONFIG }}
          deployer_kubeconfig: ${{ secrets.DEPLOYER_KUBECONFIG }}
          namespace: ${{ env.namespace }}
          etcd_forward: true

      - name: Deploy init pods + all apps (parallel)
        uses: HerodotusDev/cicd/.github/actions/deploy-all-to-k8s@main
        with:
          namespace: ${{ env.namespace }}
          k8s_env: ${{ env.k8s_env }}
          matrix_deploy: ${{ needs.prep.outputs.matrix_deploy }}
          matrix_init: ${{ needs.prep.outputs.matrix_init }}
          app_versions: ${{ needs.prep.outputs.app_versions }}
          primary_version: ${{ needs.prep.outputs.primary_version }}
          registry: ${{ env.registry }}
          image_suffix: ${{ env.image_suffix }}
          rollout_timeout: ${{ env.rollout_timeout }}
          etcd_root: ${{ env.etcd_root || env.repo_name }}
          etcd_user: ${{ env.ETCD_USER }}
          etcd_password: ${{ env.ETCD_PASSWORD }}
