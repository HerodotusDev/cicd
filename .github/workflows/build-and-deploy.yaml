name: Build & deploy

on:
  workflow_call:
    inputs:
      submodules:
        description: "Submodule checkout mode: 'true' (direct only, default), 'recursive' (all nested), or 'false' (none)."
        type: string
        required: false
        default: "true"
      build-strategy:
        description: "Build execution mode: 'parallel' (default; one matrix job per app) or 'sequential' (one job builds all apps in order inside a single buildx context, so the first build pays for shared compile layers and the rest hit the in-job layer cache)."
        type: string
        required: false
        default: "parallel"
    secrets:
      SUBMODULES_PAT:
        description: "PAT for cloning private submodules. If omitted, submodules are still fetched with GITHUB_TOKEN (works for public submodules)."
        required: false

env:
  rollout_timeout: 500
  version_file: ./package.json
  version_key:
  inputs_files: ./k8s/cicd-inputs.yaml
  dockerhub_project: dataprocessor

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: HerodotusDev/cicd/.github/actions/guard-branch@main

      - name: Validate build-strategy input
        if: inputs.build-strategy != 'parallel' && inputs.build-strategy != 'sequential'
        run: |
          echo "::error::Invalid build-strategy '${{ inputs.build-strategy }}'. Supported values: 'parallel' (default), 'sequential'."
          exit 1

  define-matrix:
    needs: [guard]
    runs-on: gcp-arc-runners
    outputs:
      matrix_apps: ${{ steps.build-matrix.outputs.matrix_apps }}
      matrix_deploy: ${{ steps.build-matrix.outputs.matrix_deploy }}
      matrix_init: ${{ steps.build-matrix.outputs.matrix_init }}
      app_versions: ${{ steps.build-matrix.outputs.app_versions }}
      primary_version: ${{ steps.build-matrix.outputs.primary_version }}
      unique_versions: ${{ steps.build-matrix.outputs.unique_versions }}
    steps:
      - name: Checkout caller repo
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Build app matrix metadata
        id: build-matrix
        uses: HerodotusDev/cicd/.github/actions/build-matrix@main
        with:
          app_matrix: ${{ steps.load-inputs.outputs.app_matrix }}
          app_names: ${{ steps.load-inputs.outputs.app_names }}
          default_version_file: ${{ env.version_file }}
          default_version_key: ${{ env.version_key }}

  build-and-push-image:
    if: inputs.build-strategy != 'sequential'
    needs: [define-matrix]
    runs-on: gcp-arc-runners
    strategy:
      matrix:
        app: ${{ fromJson(needs.define-matrix.outputs.matrix_deploy) }}
    steps:
      - name: Checkout caller repo
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Pull build-time .env from ETCD
        id: build-env
        if: matrix.app.etcd_build_env == true
        uses: HerodotusDev/cicd/.github/actions/pull-etcd-build-env@main
        with:
          namespace: ${{ env.namespace }}
          app_name: ${{ matrix.app.etcd_name || matrix.app.name }}
          etcd_root: ${{ env.etcd_root || env.repo_name }}
          etcd_user: ${{ env.ARC_ETCD_USER }}
          etcd_password: ${{ env.ARC_ETCD_PASSWORD }}
          k8s_env: ${{ env.k8s_env }}

      - name: Build and push image
        uses: HerodotusDev/cicd/.github/actions/build-and-push-image@main
        with:
          dockerhub_project: ${{ env.dockerhub_project }}
          app_name: ${{ matrix.app.name }}
          image_prefix: ${{ env.image_prefix }}
          version: ${{ fromJson(needs.define-matrix.outputs.app_versions)[matrix.app.name] }}
          docker_username: ${{ env.ARC_DOCKER_USERNAME }}
          docker_password: ${{ env.ARC_DOCKER_PASSWORD }}
          dockerfile: ${{ matrix.app.dockerfile }}
          context: ${{ matrix.app.context }}
          checkout_token: ${{ secrets.SUBMODULES_PAT }}
          submodules: ${{ inputs.submodules }}
          build_env_file: ${{ steps.build-env.outputs.env_file }}
          cache_mode: ${{ matrix.app.cache_mode || 'max' }}
          cache_scope: ${{ matrix.app.cache_scope || '' }}

  build-and-push-image-sequential:
    if: inputs.build-strategy == 'sequential'
    needs: [define-matrix]
    runs-on: gcp-arc-runners
    steps:
      - name: Checkout caller repo
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Build and push all images sequentially
        uses: HerodotusDev/cicd/.github/actions/build-and-push-image-sequential@main
        with:
          dockerhub_project: ${{ env.dockerhub_project }}
          image_prefix: ${{ env.image_prefix }}
          matrix_deploy: ${{ needs.define-matrix.outputs.matrix_deploy }}
          app_versions: ${{ needs.define-matrix.outputs.app_versions }}
          docker_username: ${{ env.ARC_DOCKER_USERNAME }}
          docker_password: ${{ env.ARC_DOCKER_PASSWORD }}
          checkout_token: ${{ secrets.SUBMODULES_PAT }}
          submodules: ${{ inputs.submodules }}
          namespace: ${{ env.namespace }}
          etcd_root: ${{ env.etcd_root || env.repo_name }}
          etcd_user: ${{ env.ARC_ETCD_USER }}
          etcd_password: ${{ env.ARC_ETCD_PASSWORD }}
          k8s_env: ${{ env.k8s_env }}

  build-and-push-init:
    needs: [define-matrix]
    runs-on: gcp-arc-runners
    strategy:
      matrix:
        app: ${{ fromJson(needs.define-matrix.outputs.matrix_init) }}
    steps:
      - name: Skip init pod build
        if: ${{ matrix.app.name == '__no_init__' }}
        run: echo "No init pods requested. Skipping build-and-push-init job."

      - name: Skip init pod build (reusing image)
        if: ${{ matrix.app.name != '__no_init__' && matrix.app.image != matrix.app.name }}
        run: echo "Init pod ${{ matrix.app.name }} reuses image from ${{ matrix.app.image }}. Skipping build."

      - name: Checkout caller repo
        if: ${{ matrix.app.name != '__no_init__' && matrix.app.image == matrix.app.name }}
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-init-inputs
        if: ${{ matrix.app.name != '__no_init__' && matrix.app.image == matrix.app.name }}
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Build and push init image
        if: ${{ matrix.app.name != '__no_init__' && matrix.app.image == matrix.app.name }}
        uses: HerodotusDev/cicd/.github/actions/build-and-push-image@main
        with:
          dockerhub_project: ${{ env.dockerhub_project }}
          app_name: ${{ matrix.app.name }}
          image_prefix: ${{ env.image_prefix }}
          version: ${{ needs.define-matrix.outputs.primary_version }}
          docker_username: ${{ env.ARC_DOCKER_USERNAME }}
          docker_password: ${{ env.ARC_DOCKER_PASSWORD }}
          dockerfile: ${{ matrix.app.dockerfile }}
          checkout_token: ${{ secrets.SUBMODULES_PAT }}
          submodules: ${{ inputs.submodules }}
          cache_mode: ${{ matrix.app.cache_mode || 'max' }}
          cache_scope: ${{ matrix.app.cache_scope || '' }}

  create-git-tag:
    needs: [define-matrix, build-and-push-image, build-and-push-image-sequential]
    if: ${{ !cancelled() && needs.define-matrix.result == 'success' && (needs.build-and-push-image.result == 'success' || needs.build-and-push-image-sequential.result == 'success') }}
    runs-on: gcp-arc-runners
    steps:
      - name: Checkout caller repo
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Create Git tag
        uses: HerodotusDev/cicd/.github/actions/create-git-tag@main
        with:
          tag: ${{ needs.define-matrix.outputs.primary_version }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-init-pods:
    needs: [define-matrix, create-git-tag, build-and-push-image, build-and-push-image-sequential, build-and-push-init]
    if: ${{ !cancelled() && needs.define-matrix.result == 'success' && needs.create-git-tag.result == 'success' && (needs.build-and-push-image.result == 'success' || needs.build-and-push-image-sequential.result == 'success') && needs.build-and-push-init.result == 'success' }}
    runs-on: gcp-arc-runners
    strategy:
      matrix:
        app: ${{ fromJson(needs.define-matrix.outputs.matrix_init) }}
    steps:
      - name: Skip deploy init pods
        if: ${{ matrix.app.name == '__no_init__' }}
        run: echo "No init pods requested. Skipping deploy-init-pods job."

      - name: Checkout caller repo
        if: ${{ matrix.app.name != '__no_init__' }}
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        if: ${{ matrix.app.name != '__no_init__' }}
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Deploy init pod
        if: ${{ matrix.app.name != '__no_init__' }}
        uses: HerodotusDev/cicd/.github/actions/deploy-init-to-k8s@main
        with:
          namespace: ${{ env.namespace }}
          pod_manifest: ./k8s/${{ env.k8s_env }}/${{ matrix.app.name }}-pod.yaml
          rollout_timeout: ${{ env.rollout_timeout }}
          image_tag: ${{ needs.define-matrix.outputs.primary_version }}
          image_prefix: ${{ env.image_prefix }}
          dockerhub_project: ${{ env.dockerhub_project }}
          app_name: ${{ matrix.app.name }}
          image_name: ${{ matrix.app.image }}

  deploy:
    needs: [define-matrix, create-git-tag, build-and-push-image, build-and-push-image-sequential, deploy-init-pods]
    if: ${{ !cancelled() && needs.define-matrix.result == 'success' && needs.create-git-tag.result == 'success' && (needs.build-and-push-image.result == 'success' || needs.build-and-push-image-sequential.result == 'success') && needs.deploy-init-pods.result == 'success' }}
    runs-on: gcp-arc-runners
    strategy:
      matrix:
        app: ${{ fromJson(needs.define-matrix.outputs.matrix_deploy) }}
    outputs:
      config_changed: ${{ steps.pull_config.outputs.config_changed == 'true' || steps.ensure_configmap.outputs.config_changed == 'true' }}
    steps:
      - name: Checkout caller repo
        uses: HerodotusDev/cicd/.github/actions/checkout-repo@main
        with:
          token: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}
          submodules: ${{ inputs.submodules }}

      - name: Load Inputs from YAML
        id: load-inputs
        uses: HerodotusDev/cicd/.github/actions/load-inputs@main
        with:
          inputs_file: ${{ env.inputs_files }}

      - name: Ensure ConfigMap from files
        id: ensure_configmap
        uses: HerodotusDev/cicd/.github/actions/create-configmap@main
        with:
          namespace: ${{ env.namespace }}
          app_name: ${{ matrix.app.name }}
          k8s_env: ${{ env.k8s_env }}

      - name: Pull config from etcd
        id: pull_config
        uses: HerodotusDev/cicd/.github/actions/pull-etcd-config@main
        with:
          namespace: ${{ env.namespace }}
          app_name: ${{ matrix.app.etcd_name }}
          etcd_user: ${{ env.ARC_ETCD_USER }}
          etcd_password: ${{ env.ARC_ETCD_PASSWORD }}
          etcd_root: ${{ env.etcd_root || env.repo_name }}
          k8s_env: ${{ env.k8s_env }}

      - name: Deploy to Kubernetes
        uses: HerodotusDev/cicd/.github/actions/deploy-to-k8s@main
        with:
          namespace: ${{ env.namespace }}
          deployment_file: ./k8s/${{ env.k8s_env }}/${{ matrix.app.manifest_name }}-deployment.yaml
          ingress_file: ./k8s/${{ env.k8s_env }}/${{ matrix.app.manifest_name }}-ingress.yaml
          rollout_timeout: ${{ env.rollout_timeout }}
          image_tag: ${{ fromJson(needs.define-matrix.outputs.app_versions)[matrix.app.name] }}
          image_prefix: ${{ env.image_prefix }}
          dockerhub_project: ${{ env.dockerhub_project }}
          app_name: ${{ matrix.app.name }}
          config_changed: ${{ steps.pull_config.outputs.config_changed == 'true' || steps.ensure_configmap.outputs.config_changed == 'true' }}
          edge_verify_secret: ${{ env.ARC_EDGE_VERIFY_SECRET }}
