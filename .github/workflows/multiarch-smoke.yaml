# Smoke test for the multi-arch build path (side branch).
# Exercises the real per-arch machinery on every push touching the build
# actions: build-and-push-image per arch on matching runners (amd64 on
# ubuntu-latest, arm64 on ubuntu-24.04-arm) pushing <tag>-<arch> tags, then
# merge-manifests assembling the list — the exact jobs consumer builds run.
# The final check executes the arm64 variant from the merged list.
name: Multi-arch build smoke

on:
  workflow_dispatch:
  push:
    branches:
      - new-main
    paths:
      - ".github/workflows/multiarch-smoke.yaml"
      - ".github/smoke/**"
      - "docker/Dockerfile.smoke-multiarch"
      - ".github/actions/build-and-push-image/**"
      - ".github/actions/build-and-push-image-sequential/**"
      - ".github/actions/merge-manifests/**"

permissions:
  contents: read
  packages: write

env:
  image: ghcr.io/herodotusdev/cicd-smoke-multiarch

jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Build and push per-arch image
        uses: HerodotusDev/cicd/.github/actions/build-and-push-image@main
        with:
          registry: ghcr.io/herodotusdev
          registry_host: ghcr.io
          app_name: cicd-smoke-multiarch
          version: ${{ github.run_id }}
          registry_username: ${{ github.actor }}
          registry_password: ${{ github.token }}
          dockerfile: smoke-multiarch
          context: .github/smoke
          platforms: ${{ format('linux/{0}', matrix.arch) }}

      - name: Execute the built image on its native arch
        run: |
          set -euo pipefail
          expected=${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}
          out=$(docker run --rm "ghcr.io/herodotusdev/cicd-smoke-multiarch:${{ github.run_id }}-${{ matrix.arch }}")
          echo "${out}"
          [ "${out}" = "arch=${expected}" ] || { echo "::error::unexpected output: ${out} (expected arch=${expected})"; exit 1; }
        shell: bash

  raw-cli-cache-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Raw buildx build with type=gha cache (full output)
        run: |
          set -euo pipefail
          docker buildx build \
            --progress=plain \
            --push \
            --file .github/smoke/Dockerfile.smoke-multiarch \
            --cache-from "type=gha,scope=raw-probe-amd64" \
            --cache-to "type=gha,mode=max,scope=raw-probe-amd64" \
            --network host \
            --tag "ghcr.io/herodotusdev/cicd-smoke-multiarch:raw-${{ github.run_id }}-amd64" \
            .github/smoke 2>&1 | tee "${RUNNER_TEMP}/raw-build.log"
          echo "=== cache lines ==="
          grep -iE "importing cache manifest|sending cache export|exporting cache|cache export" "${RUNNER_TEMP}/raw-build.log" || echo "NO CACHE LINES FOUND"
          echo "=== env present ==="
          for v in GITHUB_ACTIONS ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_RUNTIME_TOKEN; do
            if [[ -n "${!v:-}" ]]; then echo "$v set"; else echo "$v MISSING"; fi
          done
        shell: bash

  merge:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge per-arch images into manifest list
        uses: HerodotusDev/cicd/.github/actions/merge-manifests@main
        with:
          registry: ghcr.io/herodotusdev
          registry_host: ghcr.io
          matrix_deploy: '[{"name": "cicd-smoke-multiarch"}]'
          matrix_init: "[]"
          app_versions: '{"cicd-smoke-multiarch": "${{ github.run_id }}"}'
          registry_username: ${{ github.actor }}
          registry_password: ${{ github.token }}

      - name: Verify merged list carries both platforms
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ env.image }}:${{ github.run_id }}" | tee /dev/stderr | grep -q "Platform:.*linux/arm64"
          docker buildx imagetools inspect "${{ env.image }}:${{ github.run_id }}" | grep -q "Platform:.*linux/amd64"
          echo "manifest list OK: amd64 + arm64"
        shell: bash
