# Smoke test for the multi-arch build path (side branch).
# Proves on a real GH runner: buildx + QEMU can build linux/amd64 + linux/arm64
# in one invocation, push a manifest list to ghcr, and the arm64 variant
# actually executes (emulated). Guards the path every consumer build relies on
# once images must run on both amd64 (ms) and arm64 (RPi) home-cluster nodes.
# Skips the registry checks until org settings allow GITHUB_TOKEN package
# pushes; build-only validation still runs.
name: Multi-arch build smoke

on:
  workflow_dispatch:
  push:
    branches:
      - new-main
    paths:
      - ".github/workflows/multiarch-smoke.yaml"
      - ".github/smoke/**"
      - ".github/actions/build-and-push-image/**"
      - ".github/actions/build-and-push-image-sequential/**"

permissions:
  contents: read
  packages: write

env:
  image: ghcr.io/herodotusdev/cicd-smoke-multiarch

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .github/smoke
          file: .github/smoke/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.image }}:smoke
          cache-from: type=gha,scope=smoke-multiarch
          cache-to: type=gha,mode=max,scope=smoke-multiarch

      - name: Verify manifest list carries both platforms
        run: |
          set -euo pipefail
          inspect=$(docker buildx imagetools inspect "${{ env.image }}:smoke")
          echo "${inspect}"
          echo "${inspect}" | grep -q "Platform: *linux/amd64" || { echo "::error::linux/amd64 missing from manifest list"; exit 1; }
          echo "${inspect}" | grep -q "Platform: *linux/arm64" || { echo "::error::linux/arm64 missing from manifest list"; exit 1; }
          echo "manifest list OK: amd64 + arm64"
        shell: bash

      - name: Execute the arm64 variant (QEMU)
        run: |
          set -euo pipefail
          out=$(docker run --rm --platform linux/arm64 "${{ env.image }}:smoke")
          echo "${out}"
          [ "${out}" = "arch=aarch64" ] || { echo "::error::unexpected arm64 output: ${out}"; exit 1; }
        shell: bash
